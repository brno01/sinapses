name: publish

# Pushing a tag such as v0.2.0 tests the package, publishes it to GitHub Packages
# as @brno01/sinapses and creates the GitHub Release. The tag must match the
# version in package.json.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # No dependency cache when publishing: a poisoned cache would end up in the package.
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@brno01"

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Check
        run: npm run typecheck && npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish

  release:
    needs: publish
    permissions:
      contents: write
    uses: brno01/.github/.github/workflows/release.yml@v1
